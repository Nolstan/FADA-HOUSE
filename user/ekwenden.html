<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ekwendeni Hostels</title>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body class="university-page theme-ekwenden">
    <header class="uni-header">
        <div class="uni-header-content">
            <div class="logo-text" style="font-size: 1.5rem; font-weight: 700; color: white;">Ekwendeni Hostels</div>
            <div class="search-container"
                style="margin: 0; max-width: 400px; background: rgba(255,255,255,0.9); border: none;">
                <i class="fas fa-search" style="margin-left: 10px; color: var(--theme-dark);"></i>
                <input id="searchInput" type="search" placeholder="Search for location..." class="search-input"
                    style="padding: 10px; border: none;">
            </div>
        </div>
    </header>


    <div class="main-content">
        <h2 class="page-title"><i class="fas fa-building"></i> Available Hostels</h2>
        <div class="filter-bar">
            <div class="filter-group">
                <select id="priceFilter">
                    <option value="">Max Price (Any)</option>
                    <option value="30000">Under K30,000</option>
                    <option value="50000">Under K50,000</option>
                    <option value="75000">Under K75,000</option>
                    <option value="100000">Under K100,000</option>
                </select>
            </div>
            <div class="filter-group">
                <select id="occupancyFilter">
                    <option value="">Occupancy (Any)</option>
                    <option value="1">1 Person</option>
                    <option value="2">2 People</option>
                </select>
            </div>
            <div class="filter-group">
                <select id="genderFilter">
                    <option value="any">Gender (Any)</option>
                    <option value="male">Male Only</option>
                    <option value="female">Female Only</option>
                    <option value="both">Both Genders</option>
                </select>
            </div>
        </div>
        <div id="hostelsContainer" class="available-rooms">
            <div style="text-align:center; padding:2rem;">Loading hostels...</div>
        </div>
        <p id="noResults"><i class="fas fa-search"></i><br>No hostels found for this location.</p>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <span>© 2025 Ekwendeni</span>
            <span class="separator">|</span>
            <span>Nolstan Logic</span>
            <span class="separator">|</span>
            <a href="mailto:nolstankumwenda@gamil.com"><i class="fas fa-envelope"></i> Email Us</a>
            <a href="tel:+265981353135"><i class="fas fa-phone"></i> Call Us</a>
        </div>
    </footer>

    <!-- This script tag loads the configuration and makes the API_BASE_URL variable available globally -->
    <script src="../configs/apiConfigs.js"></script>

    <script>
        const city = 'ekwendeni';
        let hostelsData = [];

        const searchInput = document.getElementById('searchInput');
        const priceFilter = document.getElementById('priceFilter');
        const occupancyFilter = document.getElementById('occupancyFilter');
        const genderFilter = document.getElementById('genderFilter');

        async function fetchHostels() {
            try {
                const params = new URLSearchParams({
                    search: searchInput.value.trim(),
                    maxPrice: priceFilter.value,
                    occupancy: occupancyFilter.value,
                    genderType: genderFilter.value
                });
                const backendURL = `${API_BASE_URL}/api/universities/${city}/hostels?${params.toString()}`;
                document.getElementById('hostelsContainer').innerHTML = `<div style="text-align:center; padding:2rem;">Loading hostels...</div>`;
                const res = await fetch(backendURL);
                if (!res.ok) throw new Error('Failed to fetch hostels');
                const hostels = await res.json();
                renderHostels(hostels);
            } catch (err) {
                document.getElementById('hostelsContainer').innerHTML = `<div style="text-align:center; padding:2rem; color:#666;">
                    <i class="fas fa-exclamation-triangle" style="font-size:2rem;"></i>
                    <p>Error loading hostels: ${err.message}</p>
                    <button onclick="fetchHostels()" style="margin-top:1rem;padding:0.5rem 1rem;background:var(--primary-color);color:white;border:none;border-radius:4px;cursor:pointer;">Try Again</button>
                </div>`;
            }
        }

        function renderHostels(hostels) {
            const container = document.getElementById('hostelsContainer');
            const noResults = document.getElementById('noResults');
            if (hostels.length === 0) {
                container.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }
            noResults.style.display = 'none';

            hostels.forEach(h => {
                const card = document.createElement('a');
                card.className = 'hostel-card';
                card.href = '#';
                card.dataset.id = h._id;

                const img = document.createElement('img');
                img.src = h.photo || '/public/image/default-hostel.jpg';
                img.alt = 'Hostel in Ekwendeni';
                img.className = 'hostel-image';
                card.appendChild(img);

                let hostelType = (h.hostelType || "").toLowerCase().trim();
                let badgeText = (hostelType === 'both' ? 'Both' : hostelType === 'female' ? 'Female' : hostelType === 'male' ? 'Male' : h.hostelType);

                if (badgeText) {
                    const badge = document.createElement('span');
                    badge.className = 'hostel-badge';
                    badge.textContent = badgeText;
                    card.appendChild(badge);
                }

                const infoDiv = document.createElement('div');
                infoDiv.className = 'hostel-info';

                const locationDiv = document.createElement('div');
                locationDiv.className = 'hostel-location';
                locationDiv.innerHTML = '<i class="fas fa-map-marker-alt"></i> ';
                locationDiv.appendChild(document.createTextNode(h.location || 'N/A'));
                infoDiv.appendChild(locationDiv);

                const detailsDiv = document.createElement('div');
                detailsDiv.className = 'hostel-details';
                const occupancyItem = document.createElement('div');
                occupancyItem.className = 'detail-item';
                occupancyItem.innerHTML = `<i class="fas fa-users"></i>`;
                occupancyItem.appendChild(document.createTextNode(`${h.occupancy} student${h.occupancy > 1 ? 's' : ''}`));
                detailsDiv.appendChild(occupancyItem);
                const genderItem = document.createElement('div');
                genderItem.className = 'detail-item';
                genderItem.innerHTML = `<i class="fas fa-venus-mars"></i>`;
                genderItem.appendChild(document.createTextNode(h.hostelType));
                detailsDiv.appendChild(genderItem);
                infoDiv.appendChild(detailsDiv);

                const priceDiv = document.createElement('div');
                priceDiv.className = 'hostel-price';
                priceDiv.textContent = `K${h.rent.toLocaleString()}/month`;
                infoDiv.appendChild(priceDiv);

                card.appendChild(infoDiv);

                card.addEventListener('click', e => {
                    e.preventDefault();
                    localStorage.setItem('selectedHostelId', card.dataset.id);
                    localStorage.setItem('selectedUniversity', 'ekwendeni');
                    window.location.href = 'all-details.html';
                });

                container.appendChild(card);
            });
        }

        let searchTimeout;
        function handleFilterChange() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(fetchHostels, 300);
        }

        [searchInput, priceFilter, occupancyFilter, genderFilter].forEach(el => el.addEventListener('input', handleFilterChange));

        fetchHostels();
    </script>
</body>

</html>
