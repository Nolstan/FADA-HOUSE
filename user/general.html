<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>General Houses - FadaHouse</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/redfin-redesign.css">
</head>

<body class="redfin-theme">
    <!-- Shared Top Nav -->
    <nav class="redfin-nav">
        <div class="rf-nav-left">
            <a href="../index.html" class="rf-logo">FADAHOUSE</a>
        </div>
        <div class="rf-nav-right">
            <a href="../index.html" class="rf-nav-link">Home</a>
            <a href="../login.html" class="rf-nav-link rf-btn-signin">Upload</a>
        </div>
    </nav>

    <div class="rf-uni-container">
        <div class="rf-uni-hero">
            <div class="rf-uni-logo-text" style="font-size: 40px;">🏠</div>
            <div class="rf-uni-title">
                <h1>Available Houses</h1>
                <p>Find residential houses and accommodation across various districts</p>
            </div>
        </div>

        <div class="rf-filter-bar">
            <div class="rf-filter-search">
                <i class="fas fa-search"></i>
                <input id="searchInput" type="search" placeholder="Search by area (e.g. Area 47)...">
            </div>

            <div class="rf-filter-group">
                <label>Max Price</label>
                <select id="priceFilter" class="rf-filter-select">
                    <option value="">Any Price</option>
                    <option value="50000">Under K50,000</option>
                    <option value="100000">Under K100,000</option>
                    <option value="200000">Under K200,000</option>
                    <option value="500000">Under K500,000</option>
                </select>
            </div>

            <div class="rf-filter-group">
                <label>District</label>
                <select id="districtFilter" class="rf-filter-select">
                    <option value="">All Districts</option>
                    <option value="Mzuzu">Mzuzu</option>
                    <option value="Rumphi">Rumphi</option>
                    <option value="Ekwendeni">Ekwendeni</option>
                    <option value="Lilongwe">Lilongwe</option>
                    <option value="Blantyre">Blantyre</option>
                    <option value="Zomba">Zomba</option>
                    <option value="Thyolo">Thyolo</option>
                </select>
            </div>
        </div>

        <div id="housesContainer" class="rf-hostel-grid">
            <!-- Dynamic Content -->
        </div>

        <div id="noResults" class="rf-no-results" style="display: none;">
            <i class="fas fa-search"></i>
            <h3>No houses found</h3>
            <p>Try adjusting your search filters or searching a different area.</p>
        </div>
    </div>

    <footer class="rf-uni-footer">
        <div class="rf-footer-links">
            <a href="../index.html">Home</a>
            <a href="mailto:nolstankumwenda@gmail.com">Contact Support</a>
            <a href="tel:+265981353135">Privacy Policy</a>
        </div>
        <div class="rf-footer-copy">
            © 2025 General Houses | Partnered with Nolstan Logic
        </div>
    </footer>

    <script src="../configs/apiConfigs.js"></script>

    <script>
        const searchInput = document.getElementById('searchInput');
        const priceFilter = document.getElementById('priceFilter');
        const districtFilter = document.getElementById('districtFilter');
        const housesContainer = document.getElementById('housesContainer');
        const noResults = document.getElementById('noResults');

        async function fetchHouses() {
            try {
                const params = new URLSearchParams({
                    search: searchInput.value.trim(),
                    maxPrice: priceFilter.value,
                    district: districtFilter.value
                });

                housesContainer.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
                    <div class="rf-spinner"></div>
                    <p>Finding the best matches...</p>
                </div>`;

                const res = await fetch(`${API_BASE_URL}/api/general-houses?${params.toString()}`);
                if (!res.ok) throw new Error('Failed to fetch houses');
                const houses = await res.json();
                renderHouses(houses);
            } catch (err) {
                housesContainer.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #d92228;">
                    <i class="fas fa-exclamation-circle" style="font-size: 32px;"></i>
                    <p>Connection error: ${err.message}</p>
                </div>`;
            }
        }

        function renderHouses(houses) {
            if (!houses || houses.length === 0) {
                housesContainer.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }
            noResults.style.display = 'none';

            housesContainer.innerHTML = houses.map(h => `
                <a class="rf-hostel-card" href="#" onclick="selectHouse('${h.id}')">
                    <div class="rf-hostel-img-wrap">
                        <img src="${h.photo || 'https://via.placeholder.com/400x300?text=No+Photo'}" alt="${h.area}">
                    </div>
                    <div class="rf-hostel-content">
                        <div class="rf-hostel-price">K${h.cost.toLocaleString()} <small>/ month</small></div>
                        <div class="rf-hostel-loc">
                            <i class="fas fa-map-marker-alt"></i> ${h.area}, ${h.district}
                        </div>
                    </div>
                </a>
            `).join('');
        }

        function selectHouse(id) {
            localStorage.setItem('selectedHouseId', id);
            window.location.href = 'all-general-details.html';
        }

        let searchTimeout;
        [searchInput, priceFilter, districtFilter].forEach(el => {
            el.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(fetchHouses, 300);
            });
        });

        // Auth handling
        const token = localStorage.getItem('token');
        const loginLink = document.querySelector('.rf-btn-signin');
        if (token) {
            loginLink.textContent = 'Sign out';
            loginLink.href = '#';
            loginLink.onclick = () => {
                localStorage.clear();
                window.location.reload();
            };
        }

        fetchHouses();
    </script>
</body>

</html>
