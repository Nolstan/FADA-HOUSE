<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MZUNI Hostels - FadaHouse</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/redfin-redesign.css">
</head>

<body class="redfin-theme">
  <!-- Shared Top Nav -->
  <nav class="redfin-nav">
    <div class="rf-nav-left">
      <a href="../index.html" class="rf-logo">FADAHOUSE</a>
    </div>
    <div class="rf-nav-right">
      <a href="../index.html" class="rf-nav-link">Home</a>
      <a href="../login.html" class="rf-nav-link rf-btn-signin">Join / Sign in</a>
    </div>
  </nav>

  <div class="rf-uni-container">
    <div class="rf-uni-hero">
      <img src="../assets/image/mzuni logo.png" alt="MZUNI Logo" class="rf-uni-logo"
        style="background: white; padding: 2px;" />
      <div class="rf-uni-title">
        <h1>MZUNI Hostels</h1>
        <p>Available student accommodation near Mzuzu University</p>
      </div>
    </div>

    <div class="rf-filter-bar">
      <div class="rf-filter-search">
        <i class="fas fa-search"></i>
        <input id="searchInput" type="search" placeholder="Search by location (e.g. Luwinga)...">
      </div>

      <div class="rf-filter-group">
        <label>Price Range</label>
        <select id="priceFilter" class="rf-filter-select">
          <option value="">Max Price (Any)</option>
          <option value="30000">Under K30,000</option>
          <option value="50000">Under K50,000</option>
          <option value="75000">Under K75,000</option>
          <option value="100000">Under K100,000</option>
        </select>
      </div>

      <div class="rf-filter-group">
        <label>Occupancy</label>
        <select id="occupancyFilter" class="rf-filter-select">
          <option value="">Any</option>
          <option value="1">1 Person</option>
          <option value="2">2 People</option>
        </select>
      </div>

      <div class="rf-filter-group">
        <label>Gender</label>
        <select id="genderFilter" class="rf-filter-select">
          <option value="any">Any</option>
          <option value="male">Male Only</option>
          <option value="female">Female Only</option>
          <option value="both">Both Genders</option>
        </select>
      </div>
    </div>

    <div id="hostelsContainer" class="rf-hostel-grid">
      <!-- Dynamic Content -->
    </div>

    <div id="noResults" class="rf-no-results" style="display: none;">
      <i class="fas fa-search"></i>
      <h3>No hostels found</h3>
      <p>Try adjusting your search filters or searching a different location.</p>
    </div>
  </div>

  <footer class="rf-uni-footer">
    <div class="rf-footer-links">
      <a href="../index.html">Home</a>
      <a href="mailto:nolstankumwenda@gamil.com">Contact Support</a>
      <a href="tel:+265981353135">Privacy Policy</a>
    </div>
    <div class="rf-footer-copy">
      © 2025 Mzuzu University | Partnered with Nolstan Logic
    </div>
  </footer>

  <script src="../configs/apiConfigs.js"></script>

  <script>
    const city = 'mzuzu';
    const searchInput = document.getElementById('searchInput');
    const priceFilter = document.getElementById('priceFilter');
    const occupancyFilter = document.getElementById('occupancyFilter');
    const genderFilter = document.getElementById('genderFilter');
    const hostelsContainer = document.getElementById('hostelsContainer');
    const noResults = document.getElementById('noResults');

    async function fetchHostels() {
      try {
        const params = new URLSearchParams({
          search: searchInput.value.trim(),
          maxPrice: priceFilter.value,
          occupancy: occupancyFilter.value,
          genderType: genderFilter.value
        });

        hostelsContainer.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
                    <div class="rf-spinner"></div>
                    <p>Fetching best matches...</p>
                </div>`;

        const res = await fetch(`${API_BASE_URL}/api/universities/${city}/hostels?${params.toString()}`);
        if (!res.ok) throw new Error('Failed to fetch hostels');
        const hostels = await res.json();
        renderHostels(hostels);
      } catch (err) {
        hostelsContainer.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #d92228;">
                    <i class="fas fa-exclamation-circle" style="font-size: 32px;"></i>
                    <p>Connection error: ${err.message}</p>
                </div>`;
      }
    }

    function renderHostels(hostels) {
      if (hostels.length === 0) {
        hostelsContainer.innerHTML = '';
        noResults.style.display = 'block';
        return;
      }
      noResults.style.display = 'none';

      hostelsContainer.innerHTML = hostels.map(h => {
        const type = (h.hostelType || "").toLowerCase().trim();
        let badgeText = '';
        if (type.includes('both')) badgeText = 'Both Genders';
        else if (type.includes('female')) badgeText = 'Female only';
        else if (type.includes('male')) badgeText = 'Male only';

        return `
                <a class="rf-hostel-card" href="#" onclick="selectHostel('${h._id}')">
                    <div class="rf-hostel-img-wrap">
                        <img src="${h.photo || 'https://via.placeholder.com/400x300?text=No+Photo'}" alt="${h.location}">
                        ${badgeText ? `<span class="rf-hostel-badge">${badgeText}</span>` : ''}
                    </div>
                    <div class="rf-hostel-content">
                        <div class="rf-hostel-price">K${h.rent.toLocaleString()} <small>/ month</small></div>
                        <div class="rf-hostel-meta">
                            <span><i class="fas fa-user-friends"></i> ${h.occupancy} student${h.occupancy > 1 ? 's' : ''}</span>
                            <span><i class="fas fa-walking"></i> ${h.distance || 'Nearby'}</span>
                        </div>
                        <div class="rf-hostel-loc">
                            <i class="fas fa-map-marker-alt"></i> ${h.location}
                        </div>
                    </div>
                </a>`;
      }).join('');
    }

    function selectHostel(id) {
      localStorage.setItem('selectedHostelId', id);
      localStorage.setItem('selectedUniversity', city);
      window.location.href = 'all-details.html';
    }

    let searchTimeout;
    [searchInput, priceFilter, occupancyFilter, genderFilter].forEach(el => {
      el.addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(fetchHostels, 300);
      });
    });

    // Auth handling
    const token = localStorage.getItem('token');
    const loginLink = document.querySelector('.rf-btn-signin');
    if (token) {
      loginLink.textContent = 'Sign out';
      loginLink.href = '#';
      loginLink.onclick = () => {
        localStorage.clear();
        window.location.reload();
      };
    }

    fetchHostels();
  </script>
</body>

</html>
