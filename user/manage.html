<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage My Property - FadaHouse</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/redfin-redesign.css">
  <style>
    .rf-manage-container {
      max-width: 800px;
      margin: 80px auto;
      padding: 0 20px;
      text-align: center;
    }

    .rf-manage-header {
      margin-bottom: 50px;
    }

    .rf-manage-header h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .rf-manage-header p {
      color: var(--redfin-grey);
      font-size: 18px;
    }

    .rf-manage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
      margin-top: 40px;
    }

    .rf-manage-card {
      background: white;
      border: 1px solid var(--redfin-border);
      border-radius: 12px;
      padding: 40px;
      text-decoration: none;
      color: var(--redfin-black);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .rf-manage-card:hover {
      border-color: var(--redfin-red);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transform: translateY(-5px);
    }

    .rf-manage-icon {
      width: 80px;
      height: 80px;
      background: #f8f8f8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: var(--redfin-red);
      transition: all 0.2s;
    }

    .rf-manage-card:hover .rf-manage-icon {
      background: var(--redfin-red);
      color: white;
    }

    .rf-manage-card h2 {
      font-size: 22px;
      font-weight: 800;
    }

    .rf-manage-card p {
      color: var(--redfin-grey);
      font-size: 15px;
      line-height: 1.5;
    }

    .rf-btn-action {
      margin-top: 10px;
      padding: 12px 24px;
      background: white;
      color: var(--redfin-red);
      border: 1px solid var(--redfin-red);
      border-radius: 4px;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.2s;
    }

    .rf-manage-card:hover .rf-btn-action {
      background: var(--redfin-red);
      color: white;
    }

    @media (max-width: 600px) {
      .rf-manage-container {
        margin: 40px auto;
      }

      .rf-manage-header h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body class="redfin-theme">
  <div class="rf-manage-container">
    <div class="rf-manage-header">
      <h1>Property Manager</h1>
      <p>Welcome back! What would you like to do with your listings today?</p>
    </div>

    <div class="rf-manage-grid">
      <a href="upload-nav.html" class="rf-manage-card">
        <div class="rf-manage-icon"><i class="fas fa-plus-circle"></i></div>
        <h2>Upload New</h2>
        <p>Add a new student hostel or general house listing to the platform.</p>
        <div class="rf-btn-action">Start Uploading</div>
      </a>

      <a href="manage-list.html" class="rf-manage-card">
        <div class="rf-manage-icon"><i class="fas fa-tasks"></i></div>
        <h2>Manage Existing</h2>
        <p>View, edit, or delete the properties you've already posted.</p>
        <div class="rf-btn-action">View My List</div>
      </a>
    </div>

    <div style="margin-top: 60px;">
      <a href="../index.html" style="color: var(--redfin-grey); text-decoration: none; font-weight: 600;">
        <i class="fas fa-arrow-left"></i> Back to Home
      </a>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '../login.html';
    }
  </script>
</body>

</html>
