<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FadaHouse</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body class="auth-page">
    <div class="login-container">
        <section class="login-section">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-home"></i>
                </div>
                <div class="logo-text">FadaHouse</div>
            </div>

            <div class="welcome-text">
                <h1>Login Here</h1>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Enter your username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="error" id="error"></div>

                <div class="options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="forgot-password.html" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" id="login-btn" class="login-btn">Login</button>

                <div class="divider">
                    <span>Or continue with</span>
                </div>

                <div class="signup-link">
                    Don't have an account? <a href="register-user.html">Sign up</a>
                </div>
            </form>
        </section>

        <section class="profile-section">
            <div class="profile-content">
                <div class="profile-image">
                    <i class="fas fa-user-circle"></i>
                </div>
            </div>
        </section>
    </div>
    <script src="configs/apiConfigs.js"></script>
    <script src="assets/javascript/login.js"></script>
</body>

</html>
