<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Agent Contact Information</title>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body class="admin-page">
    <header class="admin-header">
        <h1>Oto-Nest-House Admin Panel</h1>
    </header>

    <div class="admin-container" style="max-width: 800px;">
        <div class="management-header">
            <h1 class="management-title">Update Agent Contacts</h1>
            <p class="management-subtitle">These details are shown to all hostel seekers.</p>
        </div>

        <div class="admin-list-container" style="margin-top: 0;">
            <form id="update-contact-form">
                <div class="admin-form-group">
                    <label for="whatsappNumber">WhatsApp Number</label>
                    <div style="position: relative;">
                        <i class="fab fa-whatsapp"
                            style="position: absolute; left: 15px; top: 15px; color: #25d366;"></i>
                        <input type="tel" id="whatsappNumber" class="admin-input" style="padding-left: 45px;"
                            placeholder="265991234567" required>
                    </div>
                    <small class="form-text">Numbers only, including country code (e.g. 265...)</small>
                </div>

                <div class="admin-form-group">
                    <label for="facebookLink">Facebook Profile Link</label>
                    <div style="position: relative;">
                        <i class="fab fa-facebook"
                            style="position: absolute; left: 15px; top: 15px; color: #1877f2;"></i>
                        <input type="url" id="facebookLink" class="admin-input" style="padding-left: 45px;"
                            placeholder="https://facebook.com/your-profile" required>
                    </div>
                </div>

                <div class="admin-form-group">
                    <label for="phoneNumber">Display Phone Number</label>
                    <div style="position: relative;">
                        <i class="fas fa-phone"
                            style="position: absolute; left: 15px; top: 15px; color: var(--theme-primary);"></i>
                        <input type="tel" id="phoneNumber" class="admin-input" style="padding-left: 45px;"
                            placeholder="099... / 088..." required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Update Contacts</button>
                <div id="output"
                    style="margin-top: 1rem; text-align: center; border-radius: 8px; padding: 10px; display: none;">
                </div>
            </form>
        </div>

        <div class="admin-list-container" style="margin-top: 2rem; background: var(--light-bg);">
            <h3 style="margin-top: 0; margin-bottom: 1.5rem; color: var(--theme-dark);"><i class="fas fa-eye"></i>
                Current Live Info</h3>
            <div class="management-list">
                <div class="management-item">
                    <div class="item-info">
                        <div class="item-title">WhatsApp</div>
                        <div class="item-details"><a id="currentWhatsapp" href="#" target="_blank">Loading...</a></div>
                    </div>
                </div>
                <div class="management-item">
                    <div class="item-info">
                        <div class="item-title">Facebook</div>
                        <div class="item-details"><a id="currentFacebook" href="#" target="_blank">Loading...</a></div>
                    </div>
                </div>
                <div class="management-item">
                    <div class="item-info">
                        <div class="item-title">Phone</div>
                        <div class="item-details"><span id="currentPhone">Loading...</span></div>
                    </div>
                </div>
            </div>
            <div style="margin-top: 2rem; text-align: center;">
                <a href="admin-nav-page.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back to
                    Dashboard</a>
            </div>
        </div>
    </div>

    <script src="../configs/apiConfigs.js"></script>
    <script>
        const API_ENDPOINT = `${API_BASE_URL}/api/contact-info`;
        const token = localStorage.getItem('token');

        document.addEventListener('DOMContentLoaded', async () => {
            const output = document.getElementById('output');
            try {
                const response = await fetch(API_ENDPOINT);
                if (!response.ok) throw new Error('Failed to load contact information.');

                const data = await response.json();
                const whatsappNumber = data.whatsappLink.split('/').pop() || '';
                document.getElementById('whatsappNumber').value = whatsappNumber;
                document.getElementById('facebookLink').value = data.facebookLink;
                document.getElementById('phoneNumber').value = data.phoneNumber;

                document.getElementById('currentWhatsapp').href = data.whatsappLink;
                document.getElementById('currentWhatsapp').textContent = data.whatsappLink;
                document.getElementById('currentFacebook').href = data.facebookLink;
                document.getElementById('currentFacebook').textContent = data.facebookLink;
                document.getElementById('currentPhone').textContent = data.phoneNumber;
            } catch (error) {
                output.textContent = error.message;
                output.style.display = 'block';
                output.style.backgroundColor = '#ffeeee';
                output.style.color = '#dc3545';
            }
        });

        document.getElementById('update-contact-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const output = document.getElementById('output');
            output.style.display = 'block';
            output.textContent = 'Updating...';
            output.style.backgroundColor = '#e3f2fd';
            output.style.color = '#1976d2';

            const whatsappNumber = document.getElementById('whatsappNumber').value.trim().replace(/\D/g, '');
            const whatsappLink = `https://wa.me/${whatsappNumber}`;
            const facebookLink = document.getElementById('facebookLink').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ whatsappLink, facebookLink, phoneNumber })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Failed to update contacts.');

                output.textContent = data.message;
                output.style.backgroundColor = '#e8f5e9';
                output.style.color = '#2e7d32';

                const updatedData = data.data;
                document.getElementById('currentWhatsapp').href = updatedData.whatsappLink;
                document.getElementById('currentWhatsapp').textContent = updatedData.whatsappLink;
                document.getElementById('currentFacebook').href = updatedData.facebookLink;
                document.getElementById('currentFacebook').textContent = updatedData.facebookLink;
                document.getElementById('currentPhone').textContent = updatedData.phoneNumber;
            } catch (error) {
                output.textContent = error.message;
                output.style.backgroundColor = '#ffeeee';
                output.style.color = '#dc3545';
            }
        });
    </script>
</body>

</html>
