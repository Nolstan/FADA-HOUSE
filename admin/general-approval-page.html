<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>General House Approvals</title>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body class="admin-page">
  <header class="admin-header">
    <h1>Oto-Nest-House Admin Panel</h1>
  </header>

  <div class="admin-container">
    <div class="management-header">
      <h1 class="management-title">General House Approvals</h1>
      <a href="admin-nav-page.html" class="btn btn-outline"
        style="display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 1rem;">
        <i class="fas fa-arrow-left"></i> Back to Dashboard
      </a>
    </div>

    <div class="admin-search-container" style="display: flex; gap: 1rem; align-items: center; max-width: 800px;">
      <div style="position: relative; flex: 2;">
        <i class="fas fa-search admin-search-icon"></i>
        <input type="text" id="searchInput" class="admin-search-input" placeholder="Search by area..." />
      </div>
      <select id="districtFilter" class="admin-select" style="flex: 1; border-radius: 30px; padding: 12px 20px;">
        <option value="">All Districts</option>
        <option value="Mzuzu">Mzuzu</option>
        <option value="Rumphi">Rumphi</option>
        <option value="Ekwendeni">Ekwendeni</option>
        <option value="Lilongwe">Lilongwe</option>
        <option value="Blantyre">Blantyre</option>
        <option value="Zomba">Zomba</option>
        <option value="Thyolo">Thyolo</option>
      </select>
    </div>

    <div id="listingsContainer" class="management-grid">
      <!-- Listings will be injected here by JavaScript -->
    </div>
  </div>

  <!-- Details Modal -->
  <div id="detailsModal" class="admin-modal">
    <div class="admin-modal-content">
      <div class="admin-modal-header">
        <h2 id="modalTitle">Listing Details</h2>
        <button class="modal-close" onclick="closeModal()"
          style="background: none; border: none; font-size: 2rem; cursor: pointer;">&times;</button>
      </div>
      <div class="admin-modal-body">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
          <div class="admin-form-group">
            <label for="modalDistrict">District</label>
            <select id="modalDistrict" class="admin-select">
              <option value="Mzuzu">Mzuzu</option>
              <option value="Rumphi">Rumphi</option>
              <option value="Ekwendeni">Ekwendeni</option>
              <option value="Lilongwe">Lilongwe</option>
              <option value="Blantyre">Blantyre</option>
              <option value="Zomba">Zomba</option>
              <option value="Thyolo">Thyolo</option>
            </select>
          </div>
          <div class="admin-form-group">
            <label for="modalArea">Area</label>
            <input type="text" id="modalArea" class="admin-input">
          </div>
        </div>
        <div class="admin-form-group">
          <label for="modalCost">Cost (MWK)</label>
          <input type="number" id="modalCost" class="admin-input">
        </div>
        <div class="admin-form-group">
          <label for="modalDescription">Description</label>
          <textarea id="modalDescription" rows="4" class="admin-textarea"></textarea>
        </div>
        <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid #eee;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
          <div class="admin-form-group">
            <label for="modalLandlordPhone">Landlord Phone</label>
            <input type="tel" id="modalLandlordPhone" class="admin-input">
          </div>
          <div class="admin-form-group">
            <label for="modalUploaderPhone">Uploader Phone</label>
            <input type="tel" id="modalUploaderPhone" class="admin-input">
          </div>
        </div>
        <div class="admin-gallery" id="modalGallery"></div>
      </div>
      <div class="admin-modal-footer">
        <button class="btn btn-primary" id="modalApproveBtn">Approve & Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Image Viewer Modal -->
  <div id="imageViewerModal" class="image-viewer-modal">
    <span class="image-viewer-close" onclick="closeImageViewer()">&times;</span>
    <img class="image-viewer-content" id="fullImageView">
  </div>

  <script src="../configs/apiConfigs.js"></script>
  <script>
    const listingsContainer = document.getElementById('listingsContainer');
    const searchInput = document.getElementById('searchInput');
    const districtFilter = document.getElementById('districtFilter');
    const modal = document.getElementById('detailsModal');
    const imageViewerModal = document.getElementById('imageViewerModal');
    let allHouses = [];
    const API_ENDPOINT = `${API_BASE_URL}/api/general-approvals`;
    const token = localStorage.getItem('token');

    async function fetchAndRenderHouses() {
      listingsContainer.innerHTML = '<div class="spinner"></div>';
      try {
        const params = new URLSearchParams({ search: searchInput.value, district: districtFilter.value });
        const response = await fetch(`${API_ENDPOINT}/pending?${params.toString()}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) {
          if (response.status === 401 || response.status === 403) window.location.href = '/public/login-reg/login.html';
          throw new Error('Network response was not ok');
        }

        allHouses = await response.json();
        renderHouses(allHouses);
      } catch (error) {
        listingsContainer.innerHTML = `<p class="error-message">Failed to load listings: ${error.message}</p>`;
      }
    }

    function renderHouses(houses) {
      if (houses.length === 0) {
        listingsContainer.innerHTML = '<p>No pending general houses found.</p>';
        return;
      }
      listingsContainer.innerHTML = houses.map(house => {
        const thumbnailUrl = house.photos && house.photos.length > 0 ? house.photos[0] : 'https://via.placeholder.com/300x180.png?text=No+Image';
        return `
                <div class="management-card" data-id="${house._id}">
                  <img src="${thumbnailUrl}" alt="House thumbnail" class="management-thumb">
                  <div class="management-content">
                    <h3>${house.area}, ${house.district}</h3>
                    <p><strong>Cost:</strong> K${house.cost.toLocaleString()}</p>
                    <p><strong>Uploader:</strong> ${house.uploaderPhone}</p>
                    <div class="item-actions" style="margin-top: 1rem;">
                        <button class="action-btn btn-approve details-btn">Details</button>
                        <button class="action-btn btn-ban approve-btn">Approve</button>
                        <button class="action-btn btn-delete delete-btn">Delete</button>
                    </div>
                  </div>
                </div>
            `}).join('');
    }

    listingsContainer.addEventListener('click', async (e) => {
      const card = e.target.closest('.management-card');
      if (!card) return;
      const id = card.dataset.id;

      if (e.target.classList.contains('details-btn')) {
        openModal(id);
        return;
      }

      if (e.target.classList.contains('approve-btn')) {
        if (confirm('Are you sure you want to approve this house?')) {
          try {
            const res = await fetch(`${API_ENDPOINT}/${id}/approve`, {
              method: 'PUT',
              headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) throw new Error('Approval failed');
            card.remove();
          } catch (err) { alert(`Error: ${err.message}`); }
        }
      }

      if (e.target.classList.contains('delete-btn')) {
        if (confirm('Are you sure you want to delete this house?')) {
          try {
            const res = await fetch(`${API_ENDPOINT}/${id}`, {
              method: 'DELETE',
              headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) throw new Error('Deletion failed');
            card.remove();
          } catch (err) { alert(`Error: ${err.message}`); }
        }
      }
    });

    document.getElementById('modalApproveBtn').addEventListener('click', async function () {
      const id = this.dataset.id;
      const updatedData = {
        district: document.getElementById('modalDistrict').value,
        area: document.getElementById('modalArea').value,
        cost: document.getElementById('modalCost').value,
        description: document.getElementById('modalDescription').value,
        landlordPhone: document.getElementById('modalLandlordPhone').value,
        uploaderPhone: document.getElementById('modalUploaderPhone').value,
      };
      try {
        const res = await fetch(`${API_ENDPOINT}/${id}/approve`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify(updatedData)
        });
        if (!res.ok) throw new Error('Approval failed');
        closeModal();
        const card = document.querySelector(`.management-card[data-id="${id}"]`);
        if (card) card.remove();
      } catch (err) { alert(`Error: ${err.message}`); }
    });

    function openModal(houseId) {
      const house = allHouses.find(h => h._id === houseId);
      if (!house) return;
      document.getElementById('modalTitle').textContent = `Details for House in ${house.area}`;
      document.getElementById('modalDistrict').value = house.district;
      document.getElementById('modalArea').value = house.area;
      document.getElementById('modalCost').value = house.cost;
      document.getElementById('modalDescription').value = house.description;
      document.getElementById('modalLandlordPhone').value = house.landlordPhone;
      document.getElementById('modalUploaderPhone').value = house.uploaderPhone;
      document.getElementById('modalApproveBtn').dataset.id = houseId;
      const gallery = document.getElementById('modalGallery');
      gallery.innerHTML = house.photos && house.photos.length > 0
        ? house.photos.map(url => `<img src="${url}" alt="House photo" onclick="openImageViewer('${url}')">`).join('')
        : '<p>No photos uploaded.</p>';
      modal.classList.add('visible');
    }

    function closeModal() { modal.classList.remove('visible'); }
    function openImageViewer(src) { document.getElementById('fullImageView').src = src; imageViewerModal.style.display = 'flex'; }
    function closeImageViewer() { imageViewerModal.style.display = 'none'; }

    window.onclick = (event) => {
      if (event.target == modal) closeModal();
      if (event.target == imageViewerModal) closeImageViewer();
    };

    searchInput.addEventListener('input', () => setTimeout(fetchAndRenderHouses, 300));
    districtFilter.addEventListener('change', fetchAndRenderHouses);
    fetchAndRenderHouses();
  </script>
</body>

</html>
