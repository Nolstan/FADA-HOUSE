<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Superadmin User</title>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body class="admin-page">
    <header class="admin-header">
        <h1>Oto-Nest-House Admin Panel</h1>
    </header>

    <div class="admin-container" style="max-width: 600px;">
        <div class="management-header">
            <h1 class="management-title" style="color: #dc3545;">Add New Superadmin</h1>
            <p class="management-subtitle"><strong>HIGH SECURITY ACTION:</strong> Superadmins have full control over the
                system.</p>
        </div>

        <div class="admin-list-container" style="margin-top: 0; border-top: 4px solid #dc3545;">
            <form id="add-superadmin-form">
                <div class="admin-form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="admin-input" placeholder="e.g., jane_doe" required>
                </div>
                <div class="admin-form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="admin-input" placeholder="e.g., jane@example.com" required>
                </div>
                <div class="admin-form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" class="admin-input" placeholder="e.g., 0888123456" required>
                </div>
                <div class="admin-form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" class="admin-input" placeholder="e.g., Zomba" required>
                </div>
                <div class="admin-form-group">
                    <label for="password">Temporary Password</label>
                    <input type="password" id="password" class="admin-input" placeholder="Min. 8 characters" required>
                </div>
                <button type="submit" class="btn btn-delete"
                    style="width: 100%; margin-top: 1rem; border-radius: 8px;">Create Superadmin Account</button>
                <div id="output"
                    style="margin-top: 1.5rem; text-align: center; border-radius: 8px; padding: 12px; display: none;">
                </div>
            </form>
            <div style="margin-top: 2rem; text-align: center;">
                <a href="admin-nav-page.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back to
                    Dashboard</a>
            </div>
        </div>
    </div>

    <script src="../configs/apiConfigs.js"></script>
    <script>
        document.getElementById('add-superadmin-form').addEventListener('submit', async function (event) {
            event.preventDefault();

            const output = document.getElementById('output');
            output.style.display = 'block';
            output.textContent = 'Processing Security Action...';
            output.style.backgroundColor = '#fff3f3';
            output.style.color = '#dc3545';

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const location = document.getElementById('location').value.trim();
            const password = document.getElementById('password').value;
            const token = localStorage.getItem('token');

            if (!token) {
                output.textContent = 'Authentication error. Please log in again.';
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/users/add-superadmin`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ username, email, password, phone, location })
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.error || 'Security action failed.');

                output.textContent = data.message;
                output.style.backgroundColor = '#e8f5e9';
                output.style.color = '#2e7d32';
                document.getElementById('add-superadmin-form').reset();

            } catch (error) {
                output.textContent = error.message;
                output.style.backgroundColor = '#ffeeee';
                output.style.color = '#dc3545';
                console.error('Error:', error);
            }
        });
    </script>
</body>

</html>
