<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Users</title>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body class="admin-page">
  <header class="admin-header">
    <h1>Oto-Nest-House Admin Panel</h1>
  </header>

  <div class="admin-list-container">
    <div class="management-header">
      <h2 class="management-title">All Registered Users <span id="userCount"
          style="font-weight: normal; font-size: 0.8em; color: #555;"></span></h2>
      <p class="management-subtitle">Manage all registered users in the system.</p>
    </div>

    <!-- Search Bar -->
    <div class="admin-search-container">
      <i class="fas fa-search admin-search-icon"></i>
      <input type="text" id="searchInput" class="admin-search-input" placeholder="Search by name, phone, or email"
        onkeyup="searchUsers()" />
    </div>

    <div class="management-list" id="userList"></div>
  </div>

  <!-- Load global API config -->
  <script src="../configs/apiConfigs.js"></script>

  <script>
    const token = localStorage.getItem('token');

    document.addEventListener('DOMContentLoaded', () => {
      fetchAndRenderUsers();
    });

    async function fetchAndRenderUsers(searchTerm = '') {
      const userList = document.getElementById('userList');
      userList.innerHTML = '<p>Loading users...</p>';

      try {
        const params = new URLSearchParams();
        if (searchTerm) params.append("search", searchTerm);

        const response = await fetch(
          `${API_BASE_URL}/api/admin/users?${params.toString()}`,
          { headers: { 'Authorization': `Bearer ${token}` } }
        );

        if (!response.ok) throw new Error(`Failed to fetch users: ${response.statusText}`);

        const data = await response.json();
        const users = data.users;
        userList.innerHTML = '';

        document.getElementById('userCount').textContent = `(${data.totalUserCount || 0} total)`;

        if (users.length === 0) {
          userList.innerHTML = searchTerm ?
            '<p>No users found matching your search.</p>' :
            '<p>No users found.</p>';
          return;
        }

        users.forEach(user => {
          const userDiv = document.createElement('div');
          userDiv.className = 'management-item';
          userDiv.dataset.id = user._id;

          const banButtonClass = user.isBanned ? 'btn-unban' : 'btn-ban';
          const banButtonText = user.isBanned ? 'Unban' : 'Ban';

          userDiv.innerHTML = `
            <div class="item-info">
              <div class="item-title">${user.username}</div>
              <div class="item-details">
                <span><i class="fas fa-envelope"></i> ${user.email}</span>
                <span><i class="fas fa-phone"></i> ${user.phone || 'N/A'}</span>
              </div>
            </div>
            <div class="item-actions">
              <button class="action-btn btn-delete" onclick="deleteUser(this)">Delete</button>
              <button class="action-btn ${banButtonClass}" onclick="toggleBan(this)">${banButtonText}</button>
            </div>
          `;
          userList.appendChild(userDiv);
        });
      } catch (error) {
        console.error('Error:', error);
        userList.innerHTML = `<p style="color: red;">Error loading users: ${error.message}</p>`;
      }
    }

    async function deleteUser(btn) {
      const userDiv = btn.closest('.user');
      const userId = userDiv.dataset.id;

      if (confirm('Are you sure you want to permanently DELETE this user?')) {
        try {
          const response = await fetch(
            `${API_BASE_URL}/api/admin/users/${userId}`,
            { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } }
          );

          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Failed to delete user.');

          userDiv.remove();
          alert(data.message);
        } catch (error) {
          console.error('Delete error:', error);
          alert(`Error: ${error.message}`);
        }
      }
    }

    async function toggleBan(btn) {
      const userDiv = btn.closest('.user');
      const userId = userDiv.dataset.id;
      const isBanning = btn.classList.contains('ban-btn');

      const action = isBanning ? 'BAN' : 'UNBAN';
      if (confirm(`Are you sure you want to ${action} this user?`)) {
        try {
          const response = await fetch(
            `${API_BASE_URL}/api/admin/users/${userId}/ban`,
            { method: 'PUT', headers: { 'Authorization': `Bearer ${token}` } }
          );

          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Failed to update status.');

          if (isBanning) {
            btn.textContent = 'Unban';
            btn.classList.replace('btn-ban', 'btn-unban');
          } else {
            btn.textContent = 'Ban';
            btn.classList.replace('btn-unban', 'btn-ban');
          }
          alert(data.message);
        } catch (error) {
          console.error('Ban/Unban error:', error);
          alert(`Error: ${error.message}`);
        }
      }
    }

    function searchUsers() {
      const searchTerm = document.getElementById('searchInput').value;
      fetchAndRenderUsers(searchTerm);
    }
  </script>
</body>

</html>
