<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Register - Hostel Accommodation</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="form-header text-center">
            <h1>Student Registration</h1>
        </div>

        <div class="form-body">
            <form id="register-form">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" id="phone" class="form-input" required pattern="[0-9]{9,13}"
                        title="Enter a valid phone number (9-13 digits)">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password" class="form-label">Confirm Password</label>
                    <input type="password" id="confirm-password" class="form-input" required>
                </div>

                <button type="submit" id="register-btn" class="btn btn-primary">Register</button>

                <div id="output"></div>
            </form>
        </div>

        <div class="form-footer text-center" style="margin-top: 1.5rem;">
            <p>Already have an account? <a href="login.html"
                    style="color: var(--primary); text-decoration: none; font-weight: 600;">Login here</a></p>
        </div>
    </div>

    <script src="configs/apiConfigs.js"></script>

    <script>
        document.getElementById('register-form').addEventListener('submit', async function (event) {
            event.preventDefault();

            const output = document.getElementById('output');
            const registerBtn = document.getElementById('register-btn');
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Reset output and disable button
            output.textContent = '';
            output.className = '';
            output.style.display = 'none';
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<span class="spinner"></span>Registering...';

            if (password !== confirmPassword) {
                output.textContent = 'Passwords do not match.';
                output.className = 'failure';
                output.style.display = 'block';
                registerBtn.disabled = false;
                registerBtn.textContent = 'Register';
                return;
            }

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;

            try {
                const response = await fetch(`${API_BASE_URL}/api/users/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, phone })
                });

                const data = await response.json();

                if (response.ok) {
                    output.textContent = data.message + ' Redirecting to verification...';
                    output.className = 'success';
                    output.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = `verify-otp.html?email=${encodeURIComponent(email)}`;
                    }, 2000);
                } else {
                    throw new Error(data.error || 'Registration failed');
                }
            } catch (error) {
                output.textContent = 'Registration failed. Please check your network and try again.';
                output.className = 'failure';
                output.style.display = 'block';
            } finally {
                // Only re-enable if not redirecting
                registerBtn.disabled = false;
                registerBtn.textContent = 'Register';
            }
        });
    </script>
</body>

</html>
