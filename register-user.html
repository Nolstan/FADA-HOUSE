<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FadaHouse - Join Today</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/redfin-redesign.css">
    <style>
        body {
            background-color: var(--rf-bg-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Background Slider */
        .rf-bg-slider {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .rf-bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            animation: rf-slideshow 15s linear infinite;
        }

        .rf-bg-slide:nth-child(1) {
            background-image: url('assets/image/modern_house_exterior_1769785268578.png');
            animation-delay: 0s;
        }

        .rf-bg-slide:nth-child(2) {
            background-image: url('assets/image/modern_kitchen_interior_1769785289393.png');
            animation-delay: 5s;
        }

        .rf-bg-slide:nth-child(3) {
            background-image: url('assets/image/modern_backyard_pool_1769785310242.png');
            animation-delay: 10s;
        }

        @keyframes rf-slideshow {
            0% {
                opacity: 0;
                transform: scale(1);
            }

            5% {
                opacity: 1;
            }

            33% {
                opacity: 1;
            }

            38% {
                opacity: 0;
                transform: scale(1.1);
            }

            100% {
                opacity: 0;
            }
        }

        .rf-reg-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            overflow-y: auto;
        }

        .rf-reg-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            margin: auto;
        }

        .redfin-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .rf-reg-card h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: var(--redfin-black);
            text-align: center;
        }

        .rf-form-group {
            margin-bottom: 12px;
        }

        .rf-form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 13px;
        }

        .rf-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            background: white;
        }

        .rf-input:focus {
            outline: none;
            border-color: var(--redfin-red);
        }

        .rf-btn-submit {
            width: 100%;
            background-color: var(--redfin-red);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
        }

        .rf-btn-submit:hover {
            background-color: var(--rf-red-hover);
        }

        .rf-auth-links {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            color: #666;
        }

        .rf-auth-links a {
            color: var(--redfin-red);
            text-decoration: none;
            font-weight: 600;
        }

        #output {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        #output.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        #output.failure {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        @media (max-height: 700px) {
            .rf-reg-wrapper {
                align-items: flex-start;
            }

            .rf-reg-card {
                margin-top: 20px;
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body>
    <!-- Background Slider -->
    <div class="rf-bg-slider">
        <div class="rf-bg-slide"></div>
        <div class="rf-bg-slide"></div>
        <div class="rf-bg-slide"></div>
    </div>

    <!-- Shared Top Nav -->
    <nav class="redfin-nav">
        <div class="rf-nav-left">
            <a href="index.html" class="rf-logo">FADAHOUSE</a>
        </div>
        <div class="rf-nav-right">
            <a href="index.html" class="rf-nav-link">Home</a>
            <a href="login.html" class="rf-nav-link">Sign In</a>
        </div>
    </nav>

    <div class="rf-reg-wrapper">
        <div class="rf-reg-card">
            <h1>Create Account</h1>

            <form id="register-form">
                <div class="rf-form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="rf-input" placeholder="e.g., student123" required>
                </div>

                <div class="rf-form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="rf-input" placeholder="e.g., name@example.com" required>
                </div>

                <div class="rf-form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" class="rf-input" placeholder="e.g., 0999123456" required
                        pattern="[0-9]{9,13}" title="Enter a valid phone number (9-13 digits)">
                </div>

                <div class="rf-form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="rf-input" placeholder="At least 8 characters"
                        minlength="8" required>
                </div>

                <div class="rf-form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" class="rf-input" placeholder="Re-enter password"
                        required>
                </div>

                <div id="output"></div>

                <button type="submit" id="register-btn" class="rf-btn-submit">Join FadaHouse</button>

                <div class="rf-auth-links">
                    Already have an account? <a href="login.html">Sign In</a>
                </div>
            </form>
        </div>
    </div>

    <script src="configs/apiConfigs.js"></script>

    <script>
        document.getElementById('register-form').addEventListener('submit', async function (event) {
            event.preventDefault();

            const output = document.getElementById('output');
            const registerBtn = document.getElementById('register-btn');
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Reset output and disable button
            output.textContent = '';
            output.className = '';
            output.style.display = 'none';
            registerBtn.disabled = true;
            registerBtn.textContent = 'Registering...';

            if (password !== confirmPassword) {
                output.textContent = 'Passwords do not match.';
                output.className = 'failure';
                output.style.display = 'block';
                registerBtn.disabled = false;
                registerBtn.textContent = 'Join FadaHouse';
                return;
            }

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;

            try {
                const response = await fetch(`${API_BASE_URL}/api/users/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, phone })
                });

                const data = await response.json();

                if (response.ok) {
                    output.textContent = data.message + ' Redirecting to verification...';
                    output.className = 'success';
                    output.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = `verify-otp.html?email=${encodeURIComponent(email)}`;
                    }, 2000);
                } else {
                    throw new Error(data.error || 'Registration failed');
                }
            } catch (error) {
                output.textContent = error.message.includes('failed to fetch')
                    ? 'Registration failed. Please check your network and try again.'
                    : error.message;
                output.className = 'failure';
                output.style.display = 'block';
            } finally {
                if (!output.classList.contains('success')) {
                    registerBtn.disabled = false;
                    registerBtn.textContent = 'Join FadaHouse';
                }
            }
        });
    </script>
</body>

</html>
